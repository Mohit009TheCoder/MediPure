<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Professional Medipure Logo -->
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for medical cross -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for heartbeat -->
    <linearGradient id="heartbeatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circular background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2"/>
  
  <!-- Medical Cross with rounded edges -->
  <g transform="translate(100, 100)">
    <!-- Vertical bar of cross -->
    <rect x="-14" y="-50" width="28" height="100" rx="6" fill="url(#crossGradient)" opacity="0.95"/>
    
    <!-- Horizontal bar of cross -->
    <rect x="-50" y="-14" width="100" height="28" rx="6" fill="url(#crossGradient)" opacity="0.95"/>
    
    <!-- Center circle for depth -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.3"/>
    
    <!-- Heartbeat line integrated into design -->
    <g opacity="0.9" filter="url(#glow)">
      <!-- Left heartbeat -->
      <path d="M -40,0 L -32,0 L -28,10 L -24,-15 L -20,0 L -12,0" 
            stroke="url(#heartbeatGradient)" 
            stroke-width="4" 
            fill="none" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Right heartbeat -->
      <path d="M 12,0 L 20,0 L 24,10 L 28,-15 L 32,0 L 40,0" 
            stroke="url(#heartbeatGradient)" 
            stroke-width="4" 
            fill="none" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Small heart icon at center -->
    <path d="M 0,-10 C -3,-13 -8,-13 -10,-10 C -12,-7 -12,-3 -10,0 L 0,10 L 10,0 C 12,-3 12,-7 10,-10 C 8,-13 3,-13 0,-10 Z" 
          fill="#ff5252" 
          opacity="0.85"
          filter="url(#glow)"/>
    
    <!-- Highlight on heart -->
    <ellipse cx="-3" cy="-6" rx="3" ry="2" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <!-- Decorative corner elements -->
  <circle cx="35" cy="50" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="165" cy="50" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="35" cy="150" r="5" fill="#ffffff" opacity="0.3"/>
  <circle cx="165" cy="150" r="5" fill="#ffffff" opacity="0.3"/>
  
  <!-- Small plus signs for medical theme -->
  <g opacity="0.25" fill="#ffffff">
    <rect x="48" y="33" width="2" height="8"/>
    <rect x="45" y="36" width="8" height="2"/>
    
    <rect x="163" y="33" width="2" height="8"/>
    <rect x="160" y="36" width="8" height="2"/>
    
    <rect x="48" y="159" width="2" height="8"/>
    <rect x="45" y="162" width="8" height="2"/>
    
    <rect x="163" y="159" width="2" height="8"/>
    <rect x="160" y="162" width="8" height="2"/>
  </g>
  
  <!-- Outer ring for polish -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
  
  <!-- Subtle shine effect on top -->
  <ellipse cx="100" cy="60" rx="60" ry="25" fill="#ffffff" opacity="0.08"/>
</svg>
